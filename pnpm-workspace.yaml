# The single home for pnpm settings: pnpm 11+ no longer reads the `pnpm` field
# in package.json, and a pnpm that finds no overrides regenerates pnpm-lock.yaml
# without its top-level `overrides:` block, after which every --frozen-lockfile
# fails with ERR_PNPM_LOCKFILE_CONFIG_MISMATCH.

overrides:
  'rollup@>=2 <2.80': '>=2.80.0'
  'brace-expansion': '>=5.0.9'
  'immutable': '>=5.1.8'
  'nanoid': '>=3.3.18'

# pnpm 11.0.0 renamed the build-script allowlist onlyBuiltDependencies ->
# allowBuilds; without it, install stops at ERR_PNPM_IGNORED_BUILDS. Counted in
# the shipped bundles, because the version in that sentence used to read 12 and
# was wrong: pnpm 10.20.0 has 0 references to allowBuilds and 35 to
# onlyBuiltDependencies, 11.0.0 has 77 and 0. Adding onlyBuiltDependencies back
# "for pnpm 11" is dead config -- 11.19.0 mentions it only in its legacy-key
# migration list and one error hint, never as a setting it reads.
allowBuilds:
  '@parcel/watcher': true
  'esbuild': true
